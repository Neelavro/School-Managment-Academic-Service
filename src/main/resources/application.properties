spring.application.name=academic-service
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academic_service}
spring.datasource.username=${DB_USERNAME:technonix}
spring.datasource.password=${DB_PASSWORD:Technonix@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.port=${SERVER_PORT:8084}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
server.error.include-message=never

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET:22349a84-1f39-4265-802e-87dbc47c90ef}
