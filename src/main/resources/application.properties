spring.application.name=academic-service
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academic_service}
spring.datasource.username=${DB_USERNAME:technonix}
spring.datasource.password=${DB_PASSWORD:Technonix@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.port=${SERVER_PORT:8084}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
server.error.include-message=never

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET}
# Student refresh token lifetime (default 30 days). Access tokens keep jwt.expiration-ms (24h).
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Student login admission control (see StudentLoginLimiter).
# max-concurrent 0 = one BCrypt at a time per CPU core.
auth.student-login.max-concurrent=${STUDENT_LOGIN_MAX_CONCURRENT:0}
auth.student-login.max-queue=${STUDENT_LOGIN_MAX_QUEUE:50}
auth.student-login.max-wait-ms=${STUDENT_LOGIN_MAX_WAIT_MS:5000}
# Let connections queue during a login burst instead of being reset (Tomcat default is 100).
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1000}

# SSLCommerz (sandbox defaults; override in .env for production)
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:testbox}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:qwerty}
sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}

# Public-facing URLs used to build SSLCommerz redirect + IPN URLs.
# Frontend = where the parent lands after paying. Backend = where SSLCommerz POSTs the IPN.
app.public-base-url-frontend=${PUBLIC_BASE_URL_FRONTEND:http://localhost:9000}
app.public-base-url-backend=${PUBLIC_BASE_URL_BACKEND:http://localhost:8084}

# Platform metrics — shared secret used by the platform_admin_service to poll this school.
# If blank, the /api/platform/metrics endpoint returns 503.
platform.metrics.secret=${PLATFORM_METRICS_SECRET:}

# Platform admin URL — base of the platform_admin_service. Used by:
#   - PlatformFeeService to fetch this school's PER_ENROLLMENT rate (cached 1h)
#   - SchoolPlatformBillsService to proxy /accounting/platform-bills
# Auth: X-Platform-Secret header = ${platform.metrics.secret}.
# If blank, platform fee defaults to 0 and the bills page shows "not configured".
platform.admin.url=${PLATFORM_ADMIN_URL:}

